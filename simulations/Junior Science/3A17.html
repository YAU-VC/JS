<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valtorta College Energy Lab</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Production Versions) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-5px); }
          75% { transform: translateX(5px); }
        }
        .animate-shake {
          animation: shake 0.4s ease-in-out;
        }
        @keyframes popIn {
          0% { transform: scale(0); opacity: 0; }
          100% { transform: scale(1); opacity: 1; }
        }
        .animate-popIn {
          animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp {
          from { transform: translateY(20px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
        .animate-slideUp {
          animation: slideUp 0.4s ease-out;
        }
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .animate-fadeIn {
          animation: fadeIn 0.3s ease-out;
        }
        .animate-spin-slow {
          animation: spin 12s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- Inline Icons to avoid UMD/Reference Errors ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Icons = {
            Zap: (p) => <IconBase {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></IconBase>,
            Sun: (p) => <IconBase {...p}><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></IconBase>,
            Battery: (p) => <IconBase {...p}><rect width="16" height="10" x="2" y="7" rx="2" ry="2" /><line x1="22" x2="22" y1="11" y2="13" /></IconBase>,
            Flame: (p) => <IconBase {...p}><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.1.2-2.2.5-3.3.3-1.1.5-2.2.5-3.3" /></IconBase>,
            Droplets: (p) => <IconBase {...p}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.8-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z" /><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97" /></IconBase>,
            Move: (p) => <IconBase {...p}><polyline points="5 9 2 12 5 15" /><polyline points="9 5 12 2 15 5" /><polyline points="15 19 12 22 9 19" /><polyline points="19 9 22 12 19 15" /><line x1="2" x2="22" y1="12" y2="12" /><line x1="12" x2="12" y1="2" y2="22" /></IconBase>,
            Lightbulb: (p) => <IconBase {...p}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2 1.5-3.5a6 6 0 0 0-11 0c0 1.5.5 2.5 1.5 3.5.8.8 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></IconBase>,
            ArrowRight: (p) => <IconBase {...p}><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></IconBase>,
            RotateCw: (p) => <IconBase {...p}><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></IconBase>,
            CheckCircle2: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></IconBase>,
            XCircle: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></IconBase>,
            Info: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></IconBase>,
            Car: (p) => <IconBase {...p}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" /><circle cx="7" cy="17" r="2" /><circle cx="17" cy="17" r="2" /></IconBase>,
            Leaf: (p) => <IconBase {...p}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" /><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" /></IconBase>,
            Target: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></IconBase>,
            Music: (p) => <IconBase {...p}><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></IconBase>,
            Atom: (p) => <IconBase {...p}><circle cx="12" cy="12" r="1" /><path d="M20.2 20.2c2.04-2.03.02-7.36-4.5-11.9-4.54-4.52-9.87-6.54-11.9-4.5-2.04 2.03-.02 7.36 4.5 11.9 4.54 4.52 9.87 6.54 11.9 4.5Z" /><path d="M15.7 15.7c4.52-4.54 6.54-9.87 4.5-11.9-2.03-2.04-7.36-.02-11.9 4.5-4.52 4.54-6.54 9.87-4.5 11.9 2.03 2.04 7.36.02 11.9-4.5Z" /></IconBase>,
            Play: (p) => <IconBase {...p}><polygon points="5 3 19 12 5 21 5 3" /></IconBase>,
            Trophy: (p) => <IconBase {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></IconBase>
        };

        const { 
            Zap, Sun, Battery, Flame, Droplets, Move, Lightbulb, 
            ArrowRight, RotateCw, CheckCircle2, XCircle, Info, 
            Car, Leaf, Target, Music, Atom, Play, Trophy 
        } = Icons;

        // --- Data & Configuration ---

        const ENERGY_TYPES = [
            { id: 'chemical', label: 'Chemical', color: 'bg-green-100 text-green-800 border-green-300', icon: <Atom size={18} /> },
            { id: 'electrical', label: 'Electrical', color: 'bg-yellow-100 text-yellow-800 border-yellow-300', icon: <Zap size={18} /> },
            { id: 'radiant', label: 'Radiant (Light)', color: 'bg-orange-100 text-orange-800 border-orange-300', icon: <Sun size={18} /> },
            { id: 'thermal', label: 'Thermal (Heat)', color: 'bg-red-100 text-red-800 border-red-300', icon: <Flame size={18} /> },
            { id: 'kinetic', label: 'Kinetic (Motion)', color: 'bg-blue-100 text-blue-800 border-blue-300', icon: <Move size={18} /> },
            { id: 'potential_grav', label: 'Gravitational', color: 'bg-indigo-100 text-indigo-800 border-indigo-300', icon: <Droplets size={18} /> },
            { id: 'potential_elastic', label: 'Elastic', color: 'bg-purple-100 text-purple-800 border-purple-300', icon: <Target size={18} /> },
            { id: 'sound', label: 'Sound', color: 'bg-pink-100 text-pink-800 border-pink-300', icon: <Music size={18} /> },
        ];

        const LEVELS = [
            {
                id: 1,
                title: "The Flashlight",
                description: "How do we get light from a battery?",
                stages: [
                    { id: 'src', label: 'Battery', icon: <Battery className="text-green-600" size={32} /> },
                    { id: 'mid', label: 'Wires', icon: <Zap className="text-yellow-500" size={32} /> },
                    { id: 'out', label: 'Bulb', icon: <Lightbulb className="text-orange-500" size={32} /> }
                ],
                solution: ['chemical', 'electrical', 'radiant'],
                hint: "Batteries store chemicals. Wires carry electricity. Bulbs emit light."
            },
            {
                id: 2,
                title: "The Morning Run",
                description: "Fueling the body for movement.",
                stages: [
                    { id: 'src', label: 'Apple', icon: <Leaf className="text-green-600" size={32} /> },
                    { id: 'mid', label: 'Muscle Cells', icon: <Atom className="text-red-500" size={32} /> },
                    { id: 'out', label: 'Running', icon: <Move className="text-blue-500" size={32} /> }
                ],
                solution: ['chemical', 'thermal', 'kinetic'],
                hint: "Food is chemical energy. Muscles get warm (heat) when working to create motion."
            },
            {
                id: 3,
                title: "Hydroelectric Dam",
                description: "Turning falling water into power.",
                stages: [
                    { id: 'src', label: 'Reservoir', icon: <Droplets className="text-blue-600" size={32} /> },
                    { id: 'mid', label: 'Turbine Spinning', icon: <RotateCw className="text-slate-600" size={32} /> },
                    { id: 'out', label: 'Power Lines', icon: <Zap className="text-yellow-500" size={32} /> }
                ],
                solution: ['potential_grav', 'kinetic', 'electrical'],
                hint: "Water up high has gravitational potential. Spinning is motion. Lines carry electricity."
            },
            {
                id: 4,
                title: "Archery",
                description: "Storing energy in a bow to launch an arrow.",
                stages: [
                    { id: 'src', label: 'Archer Arm', icon: <Move className="text-orange-600" size={32} /> },
                    { id: 'mid', label: 'Bent Bow', icon: <Target className="text-purple-600" size={32} /> },
                    { id: 'out', label: 'Flying Arrow', icon: <ArrowRight className="text-teal-600" size={32} /> }
                ],
                solution: ['kinetic', 'potential_elastic', 'kinetic'],
                hint: "Moving arm pulls the string. The bent bow stores elastic energy. The arrow moves."
            },
            {
                id: 5,
                title: "Gasoline Car",
                description: "Burning fuel to move a vehicle.",
                stages: [
                    { id: 'src', label: 'Fuel Tank', icon: <Droplets className="text-amber-700" size={32} /> },
                    { id: 'mid', label: 'Engine Explosion', icon: <Flame className="text-red-500" size={32} /> },
                    { id: 'out', label: 'Moving Car', icon: <Car className="text-blue-600" size={32} /> }
                ],
                solution: ['chemical', 'thermal', 'kinetic'],
                hint: "Gasoline is a chemical. Engines burn it creating heat/expansion, which turns the wheels."
            }
        ];

        // --- Components ---

        const EnergyCard = ({ type, isSelected, onClick, disabled }) => (
            <button
                onClick={() => !disabled && onClick(type)}
                className={`
                    relative flex flex-col items-center justify-center p-3 rounded-xl border-2 transition-all duration-200 shadow-sm
                    ${disabled ? 'opacity-50 cursor-not-allowed grayscale' : 'cursor-pointer hover:shadow-md hover:-translate-y-1'}
                    ${isSelected ? 'ring-4 ring-offset-2 ring-blue-400 scale-105 z-10' : ''}
                    ${type.color}
                `}
            >
                <div className="mb-2 p-2 bg-white/50 rounded-full">{type.icon}</div>
                <span className="text-xs font-bold text-center leading-tight">{type.label}</span>
            </button>
        );

        const Slot = ({ index, content, isTarget, onClick, isCorrect, isWrong, showPulse }) => {
            const energyType = ENERGY_TYPES.find(e => e.id === content);

            return (
                <div className="flex flex-col items-center gap-2">
                    {/* The Chain Connector Arrow */}
                    {index > 0 && (
                        <div className="absolute top-12 -left-8 sm:-left-12 text-slate-300">
                            <ArrowRight size={24} strokeWidth={3} />
                        </div>
                    )}
                    
                    {/* The Drop Zone */}
                    <div 
                        onClick={onClick}
                        className={`
                            relative w-24 h-24 sm:w-28 sm:h-28 rounded-xl border-2 border-dashed flex items-center justify-center transition-all duration-300
                            ${isTarget ? 'ring-4 ring-blue-200 border-blue-400 bg-blue-50' : ''}
                            ${isCorrect ? 'border-green-500 bg-green-50 ring-4 ring-green-100 border-solid' : ''}
                            ${isWrong ? 'border-red-500 bg-red-50 animate-shake border-solid' : ''}
                            ${!content && !isTarget && !isCorrect && !isWrong ? 'border-slate-300 bg-slate-50 hover:border-slate-400' : ''}
                            ${showPulse ? 'animate-pulse' : ''}
                        `}
                    >
                        {energyType ? (
                            <div className={`flex flex-col items-center animate-popIn p-2 text-center`}>
                                <div className={`p-2 rounded-full mb-1 ${energyType.color.split(' ')[0]}`}>
                                    {energyType.icon}
                                </div>
                                <span className="text-xs font-bold text-slate-700">{energyType.label}</span>
                            </div>
                        ) : (
                            <span className="text-slate-400 text-sm font-medium">Tap to Place</span>
                        )}

                        {/* Status Icon */}
                        {isCorrect && (
                            <div className="absolute -top-2 -right-2 bg-white rounded-full text-green-500 shadow-sm">
                                <CheckCircle2 size={24} fill="white" />
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Modal = ({ title, children, action, actionLabel }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fadeIn">
                <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden animate-slideUp">
                    <div className="p-6">
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">{title}</h2>
                        <div className="text-slate-600">{children}</div>
                    </div>
                    <div className="bg-slate-50 p-4 flex justify-end">
                        <button 
                            onClick={action}
                            className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold transition-colors flex items-center gap-2 shadow-lg shadow-blue-200"
                        >
                            {actionLabel} <ArrowRight size={18} />
                        </button>
                    </div>
                </div>
            </div>
        );

        // --- Main Game Component ---

        function EnergyLab() {
            const [gameState, setGameState] = useState('start'); // start, playing, levelComplete, gameComplete
            const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
            const [slots, setSlots] = useState([null, null, null]);
            const [selectedEnergy, setSelectedEnergy] = useState(null);
            const [feedback, setFeedback] = useState({ index: null, type: null }); // { index: number, type: 'correct' | 'wrong' }
            const [score, setScore] = useState(0);

            const currentLevel = LEVELS[currentLevelIdx];

            useEffect(() => {
                // Reset slots when level changes
                setSlots([null, null, null]);
                setSelectedEnergy(null);
                setFeedback({ index: null, type: null });
            }, [currentLevelIdx]);

            const handleSlotClick = (index) => {
                if (!selectedEnergy) return;
                
                // Don't allow changing correct answers
                if (slots[index] === currentLevel.solution[index]) return;

                const newSlots = [...slots];
                newSlots[index] = selectedEnergy.id;
                setSlots(newSlots);

                // Check correctness immediately
                if (selectedEnergy.id === currentLevel.solution[index]) {
                    setFeedback({ index, type: 'correct' });
                    // Clear feedback after a moment
                    setTimeout(() => setFeedback({ index: null, type: null }), 1000);
                    
                    // Check win condition
                    const isLevelDone = newSlots.every((s, i) => s === currentLevel.solution[i]);
                    if (isLevelDone) {
                        setScore(s => s + 100);
                        setTimeout(() => {
                            if (currentLevelIdx < LEVELS.length - 1) {
                                setGameState('levelComplete');
                            } else {
                                setGameState('gameComplete');
                            }
                        }, 800);
                    }
                } else {
                    setFeedback({ index, type: 'wrong' });
                    // Remove wrong answer after short delay
                    setTimeout(() => {
                        setFeedback({ index: null, type: null });
                        const resetSlots = [...newSlots];
                        resetSlots[index] = null;
                        setSlots(resetSlots);
                    }, 600);
                }
                
                setSelectedEnergy(null);
            };

            const nextLevel = () => {
                setCurrentLevelIdx(c => c + 1);
                setGameState('playing');
            };

            const restartGame = () => {
                setCurrentLevelIdx(0);
                setScore(0);
                setGameState('start');
            };

            // --- Screens ---

            if (gameState === 'start') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-blue-100 flex items-center justify-center p-4 font-sans text-slate-800">
                        <div className="max-w-2xl w-full bg-white rounded-3xl shadow-xl overflow-hidden">
                            <div className="bg-blue-600 p-8 text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-full opacity-10">
                                    <Zap size={200} className="absolute -left-10 -top-10 rotate-12" />
                                    <Sun size={150} className="absolute right-10 bottom-10 animate-spin-slow" />
                                </div>
                                <div className="relative z-10">
                                    <div className="inline-flex items-center justify-center p-4 bg-white/20 backdrop-blur-md rounded-full mb-6 shadow-inner">
                                        <Zap size={48} className="text-yellow-300" fill="currentColor" />
                                    </div>
                                    <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight uppercase">Energy Lab<br/><span className="text-2xl md:text-3xl font-bold opacity-90 block mt-2">Valtorta College</span></h1>
                                    <p className="text-blue-100 text-xl font-medium max-w-lg mx-auto leading-relaxed">
                                        Become a scientist and trace the flow of energy through the universe.
                                    </p>
                                </div>
                            </div>
                            
                            <div className="p-8 md:p-12">
                                <div className="grid md:grid-cols-3 gap-6 mb-10">
                                    {[
                                        { icon: <Move size={24} />, title: "Identify", desc: "Recognize energy forms" },
                                        { icon: <RotateCw size={24} />, title: "Transform", desc: "Connect the chain" },
                                        { icon: <Trophy size={24} />, title: "Master", desc: "Complete 5 Labs" }
                                    ].map((item, i) => (
                                        <div key={i} className="bg-slate-50 p-6 rounded-xl border border-slate-100 text-center">
                                            <div className="bg-blue-100 text-blue-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
                                                {item.icon}
                                            </div>
                                            <h3 className="font-bold text-slate-800 mb-1">{item.title}</h3>
                                            <p className="text-sm text-slate-500">{item.desc}</p>
                                        </div>
                                    ))}
                                </div>

                                <button 
                                    onClick={() => setGameState('playing')}
                                    className="w-full bg-slate-900 hover:bg-slate-800 text-white text-xl font-bold py-4 rounded-xl shadow-lg hover:shadow-xl hover:scale-[1.01] transition-all flex items-center justify-center gap-3"
                                >
                                    <Play fill="currentColor" /> Start Experiment
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-20">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-1.5 rounded-lg">
                                    <Zap size={20} className="text-white" fill="currentColor" />
                                </div>
                                <div className="flex flex-col sm:flex-row sm:items-baseline gap-1">
                                    <span className="font-bold text-slate-700">Energy Lab</span>
                                    <span className="text-xs text-slate-500 font-medium">Valtorta College</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-6">
                                <div className="flex flex-col items-center">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Level</span>
                                    <span className="font-bold text-slate-800">{currentLevelIdx + 1}/{LEVELS.length}</span>
                                </div>
                                <div className="w-px h-8 bg-slate-200"></div>
                                <div className="flex flex-col items-center">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Score</span>
                                    <span className="font-bold text-blue-600">{score}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Game Area */}
                    <main className="flex-1 max-w-4xl mx-auto w-full p-4 flex flex-col">
                        
                        {/* Level Instructions */}
                        <div className="mb-6 text-center py-4">
                            <h2 className="text-2xl font-black text-slate-800 mb-2">{currentLevel.title}</h2>
                            <p className="text-slate-600 text-lg">{currentLevel.description}</p>
                            <div className="mt-2 inline-flex items-center gap-1.5 bg-yellow-50 text-yellow-800 text-xs px-3 py-1 rounded-full border border-yellow-200">
                                <Info size={14} />
                                <span>Hint: {currentLevel.hint}</span>
                            </div>
                        </div>

                        {/* Visualization Chain */}
                        <div className="flex-1 flex flex-col justify-center items-center gap-8 mb-8 relative">
                           {/* Connecting Line Background */}
                           <div className="absolute top-[4.5rem] left-10 right-10 h-1 bg-slate-200 -z-10 hidden sm:block"></div>

                           <div className="grid grid-cols-3 gap-4 sm:gap-12 w-full">
                             {currentLevel.stages.map((stage, idx) => (
                               <div key={idx} className="flex flex-col items-center relative group">
                                 {/* Visual Object */}
                                 <div className="w-20 h-20 sm:w-24 sm:h-24 bg-white rounded-2xl shadow-sm border border-slate-200 flex items-center justify-center z-10 group-hover:scale-110 transition-transform duration-300">
                                   {stage.icon}
                                 </div>
                                 
                                 {/* Label - Relocated and Styled for Visibility */}
                                 <div className="z-20 my-3">
                                    <span className="inline-block bg-white/95 border border-slate-200 shadow-sm rounded-full px-3 py-1 text-xs sm:text-sm font-bold text-slate-800 text-center whitespace-nowrap">
                                        {stage.label}
                                    </span>
                                 </div>

                                 {/* Interactive Slot */}
                                 <Slot 
                                   index={idx}
                                   content={slots[idx]}
                                   isTarget={selectedEnergy !== null && slots[idx] === null}
                                   isCorrect={slots[idx] === currentLevel.solution[idx]}
                                   isWrong={feedback.index === idx && feedback.type === 'wrong'}
                                   onClick={() => handleSlotClick(idx)}
                                   showPulse={selectedEnergy !== null && slots[idx] === null}
                                 />
                               </div>
                             ))}
                           </div>
                        </div>

                        {/* Inventory */}
                        <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-4 sm:p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-slate-700 flex items-center gap-2">
                                    <Atom size={18} className="text-blue-500" />
                                    Energy Types
                                </h3>
                                {selectedEnergy && (
                                    <span className="text-xs text-blue-500 font-medium animate-pulse">
                                        Select a slot above...
                                    </span>
                                )}
                            </div>
                            
                            <div className="grid grid-cols-4 sm:grid-cols-8 gap-2 sm:gap-3">
                                {ENERGY_TYPES.map((energy) => (
                                    <EnergyCard 
                                        key={energy.id}
                                        type={energy}
                                        isSelected={selectedEnergy?.id === energy.id}
                                        onClick={() => setSelectedEnergy(energy === selectedEnergy ? null : energy)}
                                        disabled={false}
                                    />
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* Modals */}
                    {gameState === 'levelComplete' && (
                        <Modal 
                            title="Transformation Successful!" 
                            action={nextLevel}
                            actionLabel="Next Experiment"
                        >
                            <div className="flex justify-center mb-6">
                                <div className="bg-green-100 p-4 rounded-full">
                                    <CheckCircle2 size={48} className="text-green-600" />
                                </div>
                            </div>
                            <p className="mb-4">
                                Excellent work! You've correctly identified the energy flow.
                                Energy is never created or destroyed, only transformed from one form to another.
                            </p>
                        </Modal>
                    )}

                    {gameState === 'gameComplete' && (
                        <Modal 
                            title="Lab Master!" 
                            action={restartGame}
                            actionLabel="Play Again"
                        >
                           <div className="flex justify-center mb-6">
                                <div className="bg-yellow-100 p-4 rounded-full animate-bounce">
                                    <Trophy size={48} className="text-yellow-600" />
                                </div>
                            </div>
                            <p className="mb-4 text-center">
                                Congratulations! You've completed all experiments with a score of <span className="font-bold text-blue-600">{score}</span>.
                                You now have a solid understanding of how energy powers our world!
                            </p>
                        </Modal>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EnergyLab />);
    </script>
</body>
</html>
