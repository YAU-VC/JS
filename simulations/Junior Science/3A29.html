<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valtorta College: Interstellar Olympics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            overflow: hidden; /* Prevent scrolling of the whole page */
        }
        
        h1, h2, .digital-font {
            font-family: 'Orbitron', sans-serif;
        }

        canvas {
            touch-action: none;
            cursor: pointer;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        .mode-btn.active {
            background-color: rgba(49, 46, 129, 0.6);
            border-color: #6366f1;
        }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-3 shadow-lg z-20 flex-shrink-0">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-4">
            <div class="flex items-center gap-3">
                <i data-lucide="rocket" class="text-indigo-400 w-6 h-6"></i>
                <h1 class="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">
                    VALTORTA COLLEGE: INTERSTELLAR OLYMPICS
                </h1>
            </div>
            <div class="hidden md:block text-xs text-gray-400">
                Interactive Physics Module v2.1
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col lg:flex-row overflow-hidden relative w-full h-full">
        
        <!-- Controls & Data Panel (Left on Desktop, Bottom on Mobile) -->
        <!-- Fixed layout: On mobile takes bottom 40%, on Desktop takes left 320px -->
        <div class="order-2 lg:order-1 w-full lg:w-80 bg-gray-800/80 p-4 flex flex-col gap-3 overflow-y-auto border-t lg:border-t-0 lg:border-r border-gray-700 backdrop-blur-md flex-shrink-0 z-10 h-[40%] lg:h-full shadow-2xl">
            
            <!-- Planet Selector -->
            <section>
                <h2 class="text-xs uppercase tracking-wider text-gray-400 mb-2 flex items-center gap-2">
                    <i data-lucide="globe" class="w-3 h-3"></i> Environment
                </h2>
                <div class="grid grid-cols-2 gap-2" id="planet-buttons">
                    <!-- Buttons generated by JS -->
                </div>
            </section>

            <!-- Sport Selector -->
            <section>
                <h2 class="text-xs uppercase tracking-wider text-gray-400 mb-2 flex items-center gap-2">
                    <i data-lucide="activity" class="w-3 h-3"></i> Event
                </h2>
                <div class="grid grid-cols-2 lg:grid-cols-1 gap-2">
                    <button onclick="setMode('jump')" id="btn-jump" class="mode-btn p-2 rounded border border-gray-600 hover:bg-gray-700 transition flex items-center gap-2 text-xs md:text-sm">
                        <i data-lucide="arrow-up-circle" class="text-emerald-400 w-4 h-4"></i> High Jump
                    </button>
                    <button onclick="setMode('longjump')" id="btn-longjump" class="mode-btn p-2 rounded border border-gray-600 hover:bg-gray-700 transition flex items-center gap-2 text-xs md:text-sm">
                        <i data-lucide="move-horizontal" class="text-purple-400 w-4 h-4"></i> Long Jump
                    </button>
                    <button onclick="setMode('lift')" id="btn-lift" class="mode-btn p-2 rounded border border-gray-600 hover:bg-gray-700 transition flex items-center gap-2 text-xs md:text-sm">
                        <i data-lucide="dumbbell" class="text-amber-400 w-4 h-4"></i> Weightlifting
                    </button>
                    <button onclick="setMode('drop')" id="btn-drop" class="mode-btn p-2 rounded border border-gray-600 hover:bg-gray-700 transition flex items-center gap-2 text-xs md:text-sm">
                        <i data-lucide="arrow-down-to-line" class="text-rose-400 w-4 h-4"></i> Drop Test
                    </button>
                </div>
            </section>

            <!-- Data Dashboard -->
            <section class="bg-gray-900 rounded-lg p-3 border border-gray-700 shadow-inner mt-auto">
                <div class="grid grid-cols-2 gap-x-3 gap-y-2">
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase">Gravity</div>
                        <div class="text-base md:text-lg digital-font text-cyan-400" id="stat-gravity">9.80 <span class="text-xs">g</span></div>
                    </div>
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase" id="stat-label-2">Weight</div>
                        <div class="text-base md:text-lg digital-font text-yellow-400" id="stat-weight">980 <span class="text-xs">N</span></div>
                    </div>
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase" id="stat-label-3">Height/Dist</div>
                        <div class="text-base md:text-lg digital-font text-emerald-400" id="stat-metric">0.00 <span class="text-xs">m</span></div>
                    </div>
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase">Time</div>
                        <div class="text-base md:text-lg digital-font text-rose-400" id="stat-time">0.00 <span class="text-xs">s</span></div>
                    </div>
                </div>
            </section>
        </div>

        <!-- Visualization Area -->
        <!-- Fixed layout: On mobile takes top 60%, on Desktop takes remaining width -->
        <div class="order-1 lg:order-2 flex-grow relative bg-black w-full h-[60%] lg:h-full">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            
            <!-- Instructions Overlay -->
            <div id="instruction-overlay" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center pointer-events-none transition-opacity duration-300">
                <div class="bg-black/70 backdrop-blur border border-white/20 px-6 py-4 rounded-2xl shadow-2xl">
                    <i id="instruction-icon" data-lucide="mouse-pointer-click" class="w-8 h-8 mx-auto mb-2 text-white animate-bounce"></i>
                    <p id="instruction-text" class="text-xl font-bold text-white uppercase tracking-widest">Hold to Charge</p>
                    <p class="text-xs text-gray-300 mt-1">Spacebar or Touch</p>
                </div>
            </div>

            <!-- Status HUD -->
            <div class="absolute top-4 left-4 flex gap-3 pointer-events-none">
                <div class="bg-black/60 backdrop-blur text-white px-3 py-1 rounded-full text-xs border border-white/10 flex items-center gap-2">
                    <span id="status-indicator" class="w-2 h-2 rounded-full bg-gray-500"></span>
                    <span id="canvas-status">Waiting</span>
                </div>
            </div>
            
            <!-- Planet Fact Footer -->
            <div class="absolute bottom-4 left-0 right-0 text-center pointer-events-none px-4">
                <p id="planet-fact" class="text-sm text-gray-200 drop-shadow-md bg-black/40 inline-block px-3 py-1 rounded-lg backdrop-blur-sm">Earth</p>
            </div>
        </div>

    </main>

    <script>
        // --- Constants ---
        const PLANETS = [
            { id: 'earth', name: 'Earth', g: 9.81, color: '#2563eb', sky: ['#1e3a8a', '#93c5fd'], ground: '#15803d', fact: "Standard Gravity (1g)" },
            { id: 'moon', name: 'Moon', g: 1.62, color: '#9ca3af', sky: ['#000000', '#1f2937'], ground: '#d1d5db', fact: "1/6th Gravity - Jump 6x higher!" },
            { id: 'mars', name: 'Mars', g: 3.72, color: '#dc2626', sky: ['#450a0a', '#fb7185'], ground: '#991b1b', fact: "38% Gravity - Red Planet Olympics" },
            { id: 'jupiter', name: 'Jupiter', g: 24.79, color: '#d97706', sky: ['#451a03', '#fcd34d'], ground: '#b45309', fact: "2.5x Gravity - Crushing weight!" }
        ];

        // --- Game State ---
        let state = {
            planet: PLANETS[0],
            mode: 'jump', // 'jump', 'longjump', 'lift', 'drop'
            animating: false,
            charging: false,
            power: 0, // 0 to 100
            time: 0,
            
            // Physics Objects
            obj: { x: 0, y: 0, vx: 0, vy: 0 },
            
            // Visuals
            scaleY: 100, // pixels per meter
            groundY: 0
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        // --- Initialization ---
        // Safer init to prevent crash if Lucide is slow
        window.onload = function() {
            init();
        };

        function init() {
            safeRefreshIcons();
            setupButtons();
            setupInput();
            
            window.addEventListener('resize', () => {
                resizeCanvas();
                updateUI();
            });
            
            // Initial setup
            resizeCanvas();
            setMode('jump'); // Default mode
            loop(); // Start render loop
        }

        function safeRefreshIcons() {
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        }

        function setupButtons() {
            const container = document.getElementById('planet-buttons');
            container.innerHTML = PLANETS.map(p => `
                <button onclick="setPlanet('${p.id}')" 
                    class="planet-btn group relative overflow-hidden p-2 rounded border border-gray-600 hover:border-${p.color}-400 transition-all text-left"
                    data-id="${p.id}">
                    <div class="relative z-10 flex items-center justify-between">
                        <span class="font-bold text-xs md:text-sm">${p.name}</span>
                        <div class="w-2 h-2 rounded-full" style="background-color: ${p.color}"></div>
                    </div>
                </button>
            `).join('');
            updatePlanetSelection();
        }

        function setupInput() {
            const startCharge = (e) => {
                // Prevent default touch actions only inside canvas to allow scrolling elsewhere if needed
                if(e.target === canvas && e.type === 'touchstart') e.preventDefault(); 
                
                if (state.animating && state.mode !== 'lift') return; 
                
                if (state.mode === 'drop') {
                     startSimulation();
                     return;
                }

                if (state.mode === 'lift') {
                    // Tapping mechanics for lift
                    if (!state.animating) {
                        startSimulation();
                    }
                    state.obj.vy -= 1.5 * state.scaleY; // Add upward burst per tap
                    // Cap upward velocity
                    if(state.obj.vy < -5 * state.scaleY) state.obj.vy = -5 * state.scaleY;
                } else {
                    // Charging mechanics for jumps
                    state.charging = true;
                    state.power = 0;
                }
            };

            const endCharge = (e) => {
                if(e.target === canvas && e.type === 'touchend') e.preventDefault();
                if (state.charging) {
                    state.charging = false;
                    startSimulation();
                }
            };

            // Canvas interactions
            canvas.addEventListener('mousedown', startCharge);
            window.addEventListener('mouseup', endCharge);
            canvas.addEventListener('touchstart', startCharge, {passive: false});
            window.addEventListener('touchend', endCharge);

            // Keyboard interactions
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') startCharge(e);
            });
            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') endCharge(e);
            });
        }

        // --- Core Logic ---

        function setPlanet(id) {
            state.planet = PLANETS.find(p => p.id === id);
            resetGame();
            updatePlanetSelection();
        }

        function setMode(mode) {
            state.mode = mode;
            resetGame();
            
            // Update UI Styling
            document.querySelectorAll('.mode-btn').forEach(btn => {
                if(btn.id === `btn-${mode}`) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            // Update Instructions
            const text = document.getElementById('instruction-text');
            const icon = document.getElementById('instruction-icon');
            
            let iconName = 'mouse-pointer-click';
            if (mode === 'lift') {
                text.innerText = "RAPIDLY TAP TO LIFT";
                iconName = 'chevrons-up';
            } else if (mode === 'drop') {
                text.innerText = "CLICK TO DROP";
                iconName = 'arrow-down';
            } else {
                text.innerText = "HOLD TO CHARGE";
                iconName = 'timer';
            }
            
            if (icon) icon.setAttribute('data-lucide', iconName);
            safeRefreshIcons();
            
            // Update Labels
            const label2 = document.getElementById('stat-label-2');
            const label3 = document.getElementById('stat-label-3');
            
            if (mode === 'jump') { label2.innerText = "ATHLETE"; label3.innerText = "HEIGHT"; }
            else if (mode === 'longjump') { label2.innerText = "ATHLETE"; label3.innerText = "DISTANCE"; }
            else if (mode === 'lift') { label2.innerText = "BARBELL"; label3.innerText = "HEIGHT"; }
            else { label2.innerText = "OBJECT"; label3.innerText = "FALL DIST"; }
        }

        function updatePlanetSelection() {
            document.querySelectorAll('.planet-btn').forEach(btn => {
                if(btn.dataset.id === state.planet.id) {
                    btn.classList.add('bg-gray-700', 'border-white');
                    btn.classList.remove('border-gray-600');
                } else {
                    btn.classList.remove('bg-gray-700', 'border-white');
                    btn.classList.add('border-gray-600');
                }
            });
        }

        function resetGame() {
            state.animating = false;
            state.charging = false;
            state.time = 0;
            state.power = 0;
            
            state.groundY = canvas.height * 0.75;
            
            // Reset Position
            state.obj.vx = 0;
            state.obj.vy = 0;
            state.obj.x = state.mode === 'longjump' ? 50 : canvas.width / 2;
            
            if (state.mode === 'drop') {
                state.obj.y = 50; // Start at top
            } else {
                state.obj.y = state.groundY; // Start on ground
            }

            const overlay = document.getElementById('instruction-overlay');
            if(overlay) overlay.style.opacity = '1';
            
            const indicator = document.getElementById('status-indicator');
            if(indicator) indicator.className = "w-2 h-2 rounded-full bg-yellow-500 animate-pulse";
            
            document.getElementById('canvas-status').innerText = "Ready";
            updateStats();
        }

        function startSimulation() {
            state.animating = true;
            document.getElementById('instruction-overlay').style.opacity = '0';
            document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-green-500";
            document.getElementById('canvas-status').innerText = "Simulating...";

            const powerFactor = Math.max(0.2, state.power / 100);

            // Initial Launch Velocities
            if (state.mode === 'jump') {
                // Max jump speed approx 8 m/s on Earth for elite
                state.obj.vy = -8 * powerFactor * state.scaleY; 
            } else if (state.mode === 'longjump') {
                // 45 degree launch approx
                const speed = 9 * powerFactor * state.scaleY;
                state.obj.vx = speed * 0.8; 
                state.obj.vy = -speed * 0.6;
            } else if (state.mode === 'drop') {
                state.obj.vy = 0;
            }
        }

        // --- Game Loop ---
        function loop() {
            requestAnimationFrame(loop);
            
            // Logic
            const dt = 0.016; // Fixed step approx 60fps
            
            if (state.charging) {
                state.power += 1.5;
                if (state.power > 100) state.power = 100;
            }

            if (state.animating) {
                state.time += dt;
                
                const gPixels = state.planet.g * state.scaleY;

                // Physics Apply Gravity
                state.obj.vy += gPixels * dt;
                state.obj.x += state.obj.vx * dt;
                state.obj.y += state.obj.vy * dt;

                // Floor Collision
                if (state.mode !== 'drop' && state.obj.y >= state.groundY) {
                    if (state.mode === 'lift') {
                        // In lift mode, hitting floor just resets velocity
                         state.obj.y = state.groundY;
                         state.obj.vy = 0;
                         // Reduce velocity damping (friction)
                    } else {
                        // Landing logic for jumps
                        state.obj.y = state.groundY;
                        state.animating = false;
                        document.getElementById('canvas-status').innerText = "Finished";
                        document.getElementById('status-indicator').className = "w-2 h-2 rounded-full bg-red-500";
                        document.getElementById('instruction-overlay').style.opacity = '1';
                    }
                }
                
                // Drop collision
                if (state.mode === 'drop' && state.obj.y >= state.groundY - 20) {
                     state.obj.y = state.groundY - 20;
                     state.animating = false;
                     document.getElementById('canvas-status').innerText = "Impact";
                     document.getElementById('instruction-overlay').style.opacity = '1';
                }
                
                // Lift Cap (Arms length)
                if (state.mode === 'lift') {
                    const liftMax = state.groundY - (2.2 * state.scaleY);
                    if (state.obj.y <= liftMax) {
                        state.obj.y = liftMax;
                        state.obj.vy = 0; // Hold at top
                    }
                }
            }

            draw();
            updateStats();
        }

        // --- Rendering ---
        function resizeCanvas() {
            const container = canvas.parentElement;
            if (container.clientWidth === 0 || container.clientHeight === 0) return;
            
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            state.scaleY = canvas.height / 10; // 10 meters visible height
            
            if(!state.animating) {
                state.groundY = canvas.height * 0.75;
                state.obj.y = state.mode === 'drop' ? 50 : state.groundY;
                draw();
            }
        }

        function draw() {
            const W = canvas.width;
            const H = canvas.height;
            if (W === 0 || H === 0) return;

            const gy = state.groundY;

            // Clear & Background
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, state.planet.sky[0]);
            grad.addColorStop(1, state.planet.sky[1]);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Stars
            if (state.planet.id !== 'earth') {
                ctx.fillStyle = 'white';
                for(let i=0; i<30; i++) {
                     ctx.fillRect((i*137)%W, (i*63)%H*0.6, 2, 2);
                }
            }

            // Ground
            ctx.fillStyle = state.planet.ground;
            ctx.fillRect(0, gy, W, H-gy);

            // Markers
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            for (let i=0; i<W; i+=state.scaleY) {
                if (state.mode === 'longjump') ctx.fillRect(i, gy, 2, 10);
            }

            // Draw Character/Object
            ctx.save();
            ctx.translate(state.obj.x, state.obj.y);
            
            if (state.mode === 'drop') {
                drawBall(0, 0);
            } else if (state.mode === 'lift') {
                drawLifter(0, 0);
            } else {
                drawJumper(0, 0);
            }
            ctx.restore();

            // Draw UI Elements on Canvas
            if ((state.charging || (state.animating && state.mode !== 'lift')) && state.mode !== 'drop') {
                // Power Bar
                const barW = Math.min(200, W * 0.8);
                const barH = 10;
                const bx = (W - barW)/2;
                const by = H - 50;
                
                ctx.fillStyle = '#333';
                ctx.fillRect(bx, by, barW, barH);
                
                // Gradient based on power
                const pColor = state.power < 50 ? '#fbbf24' : '#ef4444';
                ctx.fillStyle = pColor;
                ctx.fillRect(bx, by, barW * (state.power/100), barH);
                
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText("POWER", W/2, by - 5);
            }
        }

        function drawJumper(x, y) {
            const s = state.scaleY / 80;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // Simple stickman that rotates slightly based on velocity
            const rot = Math.min(Math.PI/4, Math.max(-Math.PI/4, state.obj.vx * 0.05));
            ctx.rotate(rot);

            // Head
            ctx.beginPath(); ctx.arc(0, -50*s, 10*s, 0, Math.PI*2); ctx.stroke();
            // Body
            ctx.beginPath(); ctx.moveTo(0, -40*s); ctx.lineTo(0, 0); ctx.stroke();
            // Legs (dynamic)
            ctx.beginPath();
            if (state.obj.y < state.groundY - 5) {
                // Jump pose
                ctx.moveTo(0, 0); ctx.lineTo(-15*s, 20*s); ctx.lineTo(-10*s, 40*s);
                ctx.moveTo(0, 0); ctx.lineTo(15*s, 15*s); ctx.lineTo(20*s, 35*s);
            } else {
                // Stand pose
                if (state.charging) {
                     // Crouch
                    ctx.moveTo(0, 0); ctx.lineTo(-10*s, 20*s); ctx.lineTo(-20*s, 50*s);
                    ctx.moveTo(0, 0); ctx.lineTo(10*s, 20*s); ctx.lineTo(20*s, 50*s);
                } else {
                    ctx.moveTo(0, 0); ctx.lineTo(-10*s, 50*s);
                    ctx.moveTo(0, 0); ctx.lineTo(10*s, 50*s);
                }
            }
            ctx.stroke();
            // Arms
            ctx.beginPath(); 
            ctx.moveTo(0, -35*s); ctx.lineTo(-20*s, -10*s);
            ctx.moveTo(0, -35*s); ctx.lineTo(20*s, -10*s);
            ctx.stroke();
        }

        function drawLifter(x, y) {
            const s = state.scaleY / 80;
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
            
            // Barbell
            ctx.fillStyle = '#444';
            const barY = -40*s; // Relative to body center/hands
            ctx.fillRect(-60*s, barY, 120*s, 4*s);
            ctx.fillStyle = '#ef4444'; // Weights
            ctx.fillRect(-70*s, barY - 15*s, 10*s, 34*s);
            ctx.fillRect(70*s, barY - 15*s, -10*s, 34*s);

            // Stickman under bar
            ctx.beginPath(); ctx.arc(0, -10*s, 10*s, 0, Math.PI*2); ctx.stroke(); // Head (lowered)
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 40*s); ctx.stroke(); // Body
            // Legs squatting
            ctx.beginPath(); 
            ctx.moveTo(0, 40*s); ctx.lineTo(-20*s, 70*s); ctx.lineTo(-25*s, 90*s);
            ctx.moveTo(0, 40*s); ctx.lineTo(20*s, 70*s); ctx.lineTo(25*s, 90*s);
            ctx.stroke();
            // Arms up to bar
            ctx.beginPath();
            ctx.moveTo(0, 10*s); ctx.lineTo(-30*s, barY);
            ctx.moveTo(0, 10*s); ctx.lineTo(30*s, barY);
            ctx.stroke();
        }

        function drawBall(x, y) {
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0, -20, 20, 0, Math.PI*2); ctx.fill();
        }

        function updateStats() {
            const elGravity = document.getElementById('stat-gravity');
            if (elGravity) elGravity.innerHTML = `${state.planet.g.toFixed(2)} <span class="text-xs">m/s²</span>`;
            
            const elFact = document.getElementById('planet-fact');
            if(elFact) elFact.innerText = `${state.planet.name}: ${state.planet.fact}`;
            
            let mass = 70;
            if (state.mode === 'lift') mass = 100;
            if (state.mode === 'drop') mass = 5;
            
            const weight = (mass * state.planet.g).toFixed(0);
            document.getElementById('stat-weight').innerHTML = `${weight} <span class="text-xs">N</span>`;
            document.getElementById('stat-time').innerHTML = `${state.time.toFixed(2)} <span class="text-xs">s</span>`;

            // Calculate Metric
            let val = 0;
            if (state.mode === 'longjump') {
                val = (state.obj.x - 50) / state.scaleY; // Distance from start x=50
            } else if (state.mode === 'drop') {
                val = (state.obj.y - 50) / state.scaleY; // Distance from top
            } else {
                val = (state.groundY - state.obj.y) / state.scaleY; // Height from ground
            }
            document.getElementById('stat-metric').innerHTML = `${Math.max(0, val).toFixed(2)} <span class="text-xs">m</span>`;
        }
    </script>
</body>
</html>
