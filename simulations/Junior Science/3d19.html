<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valtorta College Heat Transfer Lab</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles for Animations -->
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .animate-spin-slow {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .animate-bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.215, 0.610, 0.355, 1.000) both;
        }
        @keyframes pulse-ray {
            0%, 100% { opacity: 0.3; height: 180px; }
            50% { opacity: 0.6; height: 220px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons (Inline SVGs to replace Lucide dependency) ---
        const Flame = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
            </svg>
        );
        const Wind = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2" />
                <path d="M9.6 4.6A2 2 0 1 1 11 8H2" />
                <path d="M12.6 19.4A2 2 0 1 0 14 16H2" />
            </svg>
        );
        const Sun = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
            </svg>
        );
        const ArrowRight = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M5 12h14" /><path d="m12 5 7 7-7 7" />
            </svg>
        );
        const RotateCcw = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" />
            </svg>
        );
        const Thermometer = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z" />
            </svg>
        );
        const Info = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" />
            </svg>
        );
        const Trophy = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
            </svg>
        );
        const CheckCircle = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" />
            </svg>
        );

        // --- Application Components ---

        // 1. Introduction Screen
        const IntroScreen = ({ onStart }) => (
            <div className="flex flex-col items-center justify-center min-h-[60vh] text-center p-6 space-y-8 animate-fade-in">
                <div className="bg-orange-100 p-6 rounded-full shadow-lg mb-4">
                    <Flame size={64} className="text-orange-600" />
                </div>
                <h1 className="text-4xl md:text-5xl font-bold text-slate-800">Valtorta College<br/><span className="text-3xl md:text-4xl text-slate-600">Heat Transfer Lab</span></h1>
                <p className="text-lg text-slate-600 max-w-xl">
                    Welcome, Apprentice Engineer! Master the three arts of heat transfer: 
                    <span className="font-semibold text-red-600"> Conduction</span>, 
                    <span className="font-semibold text-blue-600"> Convection</span>, and 
                    <span className="font-semibold text-yellow-600"> Radiation</span>.
                </p>
                <button 
                    onClick={onStart}
                    className="group bg-slate-900 text-white px-8 py-4 rounded-xl text-xl font-bold hover:bg-slate-800 transition-all shadow-xl hover:shadow-2xl hover:-translate-y-1 flex items-center gap-2"
                >
                    Start Experiments <ArrowRight className="group-hover:translate-x-1 transition-transform" />
                </button>
            </div>
        );

        // 2. Conduction Experiment
        const ConductionExp = ({ onComplete }) => {
            const [started, setStarted] = useState(false);
            const [finished, setFinished] = useState(false);
            const [winner, setWinner] = useState(null);
            const [progress, setProgress] = useState({ metal: 0, plastic: 0, wood: 0 });
            const [prediction, setPrediction] = useState(null);
            
            const materials = [
                { id: 'metal', name: 'Metal Spoon', color: 'bg-gray-400', speed: 1.5, desc: 'High Conductivity' },
                { id: 'wood', name: 'Wooden Spoon', color: 'bg-amber-700', speed: 0.2, desc: 'Low Conductivity' },
                { id: 'plastic', name: 'Plastic Spoon', color: 'bg-blue-400', speed: 0.1, desc: 'Insulator' },
            ];

            useEffect(() => {
                let interval;
                if (started && !finished) {
                    interval = setInterval(() => {
                        setProgress(prev => {
                            const newProgress = {
                                metal: Math.min(prev.metal + materials.find(m => m.id === 'metal').speed, 100),
                                wood: Math.min(prev.wood + materials.find(m => m.id === 'wood').speed, 100),
                                plastic: Math.min(prev.plastic + materials.find(m => m.id === 'plastic').speed, 100),
                            };

                            if (newProgress.metal >= 100 && !winner) {
                                setWinner('metal');
                                setFinished(true);
                            }
                            return newProgress;
                        });
                    }, 50);
                }
                return () => clearInterval(interval);
            }, [started, finished, winner]);

            const handleStart = () => {
                if (!prediction) return;
                setStarted(true);
            };

            const reset = () => {
                setStarted(false);
                setFinished(false);
                setWinner(null);
                setProgress({ metal: 0, plastic: 0, wood: 0 });
                setPrediction(null);
            };

            return (
                <div className="max-w-4xl mx-auto w-full">
                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden">
                        <div className="bg-red-500 p-6 text-white flex justify-between items-center">
                            <div>
                                <h2 className="text-2xl font-bold flex items-center gap-2"><Flame /> Experiment 1: Conduction</h2>
                                <p className="opacity-90">Heat moving through direct contact.</p>
                            </div>
                            <div className="bg-white/20 px-4 py-2 rounded-lg backdrop-blur-sm">
                                Target: Melt the butter!
                            </div>
                        </div>

                        <div className="p-8 space-y-8">
                            {!started ? (
                                <div className="text-center space-y-6">
                                    <h3 className="text-xl font-semibold text-slate-800">Hypothesis Time: Which spoon will conduct heat fastest?</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {materials.map((m) => (
                                            <button
                                                key={m.id}
                                                onClick={() => setPrediction(m.id)}
                                                className={`p-6 rounded-xl border-2 transition-all ${prediction === m.id ? 'border-red-500 bg-red-50 ring-2 ring-red-200' : 'border-slate-200 hover:border-slate-300'}`}
                                            >
                                                <div className={`w-16 h-16 mx-auto rounded-full ${m.color} mb-4 flex items-center justify-center shadow-inner`}>
                                                    <span className="text-white/50 text-xs">Atom</span>
                                                </div>
                                                <p className="font-bold text-slate-700">{m.name}</p>
                                                <p className="text-sm text-slate-500">{m.desc}</p>
                                            </button>
                                        ))}
                                    </div>
                                    <button 
                                        onClick={handleStart}
                                        disabled={!prediction}
                                        className="bg-red-600 text-white px-8 py-3 rounded-lg font-bold disabled:opacity-50 hover:bg-red-700 transition-colors"
                                    >
                                        Start Heating
                                    </button>
                                </div>
                            ) : (
                                <div className="relative h-64 bg-slate-100 rounded-xl border-b-8 border-slate-300 flex justify-center items-end pb-0 overflow-hidden">
                                    {/* The Pot */}
                                    <div className="absolute bottom-0 w-full h-24 bg-red-100 flex justify-center items-center z-0">
                                        <div className="w-full h-full bg-gradient-to-t from-red-600 to-red-400 opacity-80 animate-pulse flex items-center justify-center">
                                            <span className="text-white font-bold tracking-widest uppercase">Boiling Water</span>
                                        </div>
                                    </div>

                                    {/* Spoons */}
                                    <div className="flex gap-12 md:gap-24 z-10 h-full items-end pb-4">
                                        {materials.map((m) => (
                                            <div key={m.id} className="relative flex flex-col items-center h-full justify-end group">
                                                {/* Butter */}
                                                <div 
                                                    className="absolute -top-4 w-8 h-8 bg-yellow-300 rounded-sm shadow-md transition-all duration-300"
                                                    style={{ 
                                                        opacity: progress[m.id] >= 100 ? 0 : 1,
                                                        transform: progress[m.id] >= 100 ? 'scale(0) translateY(20px)' : 'scale(1)',
                                                        top: '10px'
                                                    }}
                                                >
                                                    <div className="text-[10px] text-center pt-8 font-bold text-yellow-600 whitespace-nowrap">Butter</div>
                                                </div>

                                                {/* Spoon Handle */}
                                                <div className={`w-8 h-48 ${m.color} rounded-t-lg relative overflow-hidden border border-black/10`}>
                                                    {/* Heat Gradient Animation */}
                                                    <div 
                                                        className="absolute bottom-0 left-0 w-full bg-gradient-to-t from-red-500 via-orange-400 to-transparent transition-all duration-75 ease-linear"
                                                        style={{ height: `${progress[m.id]}%`, opacity: 0.8 }}
                                                    />
                                                </div>
                                                <div className="mt-2 font-bold text-slate-600 bg-white/80 px-2 rounded">{m.name}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {finished && (
                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 animate-fade-in">
                                    <div className="flex items-start gap-4">
                                        {prediction === 'metal' ? (
                                            <div className="bg-green-100 p-3 rounded-full"><CheckCircle className="text-green-600" size={32} /></div>
                                        ) : (
                                            <div className="bg-yellow-100 p-3 rounded-full"><Info className="text-yellow-600" size={32} /></div>
                                        )}
                                        <div>
                                            <h4 className="text-xl font-bold text-slate-800 mb-2">
                                                {prediction === 'metal' ? 'Correct! Metal is a Conductor.' : 'Not quite!'}
                                            </h4>
                                            <p className="text-slate-600 mb-4">
                                                Metals have free-moving electrons that transfer energy rapidly. Wood and plastic are <strong>insulators</strong>, meaning their atoms hold onto their energy tightly, slowing down heat transfer.
                                            </p>
                                            <div className="flex gap-4">
                                                <button onClick={reset} className="flex items-center gap-2 text-slate-500 hover:text-slate-800 font-semibold">
                                                    <RotateCcw size={18} /> Try Again
                                                </button>
                                                <button onClick={onComplete} className="bg-slate-900 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-800 ml-auto flex items-center gap-2">
                                                    Next Level <ArrowRight size={18} />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 3. Convection Experiment
        const ConvectionExp = ({ onComplete }) => {
            const [heaterPos, setHeaterPos] = useState(null); 
            const [simulating, setSimulating] = useState(false);
            const [score, setScore] = useState(0); 

            const canvasRef = useRef(null);

            useEffect(() => {
                if (!simulating) return;

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrame;
                
                // Initialize particles
                let localParticles = Array.from({ length: 50 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: 0,
                    vy: 0,
                    temp: 0, 
                    life: Math.random() * 100
                }));

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw Room Background
                    ctx.fillStyle = '#f1f5f9';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Heater Source Logic
                    let sourceX, sourceY, sourceW, sourceH;
                    if (heaterPos === 'floor') {
                        sourceX = canvas.width / 2 - 40; sourceY = canvas.height - 20; sourceW = 80; sourceH = 20;
                    } else if (heaterPos === 'ceiling') {
                        sourceX = canvas.width / 2 - 40; sourceY = 0; sourceW = 80; sourceH = 20;
                    } else { // Wall
                        sourceX = 0; sourceY = canvas.height / 2 - 40; sourceW = 20; sourceH = 80;
                    }

                    // Draw Heater
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(sourceX, sourceY, sourceW, sourceH);
                    
                    // Update Particles
                    localParticles.forEach(p => {
                        // Heating up near heater
                        const dx = p.x - (sourceX + sourceW/2);
                        const dy = p.y - (sourceY + sourceH/2);
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist < 60) {
                            p.temp = Math.min(p.temp + 0.05, 1);
                        } else {
                            p.temp = Math.max(p.temp - 0.005, 0); 
                        }

                        // Physics: Hot air rises (vy decreases), Cold air sinks (vy increases)
                        if (p.temp > 0.5) {
                            p.vy -= 0.1; // Rise
                        } else {
                            p.vy += 0.05; // Sink
                        }

                        // Random movement + Drift
                        p.vx += (Math.random() - 0.5) * 0.5;
                        
                        // Wall boundaries
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        // Friction
                        p.vx *= 0.95;
                        p.vy *= 0.95;

                        p.x += p.vx;
                        p.y += p.vy;

                        // Keep in bounds
                        p.x = Math.max(0, Math.min(canvas.width, p.x));
                        p.y = Math.max(0, Math.min(canvas.height, p.y));

                        // Draw Particle
                        const r = Math.floor(255 * p.temp);
                        const b = Math.floor(255 * (1 - p.temp));
                        ctx.fillStyle = `rgba(${r}, 0, ${b}, 0.7)`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 4 + p.temp * 4, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    
                    animationFrame = requestAnimationFrame(animate);
                };

                animate();

                const timer = setTimeout(() => {
                    setSimulating(false);
                    if (heaterPos === 'floor') setScore(95);
                    if (heaterPos === 'wall') setScore(60);
                    if (heaterPos === 'ceiling') setScore(20);
                }, 5000);

                return () => {
                    cancelAnimationFrame(animationFrame);
                    clearTimeout(timer);
                };
            }, [simulating, heaterPos]);

            const reset = () => {
                setHeaterPos(null);
                setScore(0);
                setSimulating(false);
            }

            return (
                <div className="max-w-4xl mx-auto w-full">
                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden">
                        <div className="bg-blue-500 p-6 text-white flex justify-between items-center">
                            <div>
                                <h2 className="text-2xl font-bold flex items-center gap-2"><Wind /> Experiment 2: Convection</h2>
                                <p className="opacity-90">Heat moving through fluids (air) via currents.</p>
                            </div>
                            <div className="bg-white/20 px-4 py-2 rounded-lg backdrop-blur-sm">
                                Target: Heat the room evenly!
                            </div>
                        </div>

                        <div className="p-8 space-y-8">
                        {score === 0 ? (
                            <div className="space-y-6">
                            <h3 className="text-xl font-semibold text-slate-800 text-center">Where should you place the heater?</h3>
                            <div className="relative h-80 w-full bg-slate-100 border-2 border-slate-300 rounded-xl overflow-hidden shadow-inner">
                                {simulating ? (
                                    <canvas ref={canvasRef} width={800} height={320} className="w-full h-full" />
                                ) : (
                                    <>
                                    <div className="absolute inset-0 flex items-center justify-center text-slate-300 font-bold text-4xl select-none">ROOM</div>
                                    
                                    <button 
                                        onClick={() => { setHeaterPos('ceiling'); setSimulating(true); }}
                                        className="absolute top-4 left-1/2 -translate-x-1/2 bg-white hover:bg-red-50 text-red-500 border-2 border-red-200 px-4 py-2 rounded-lg font-bold shadow-sm transition-transform hover:scale-105"
                                    >
                                        Place on Ceiling
                                    </button>

                                    <button 
                                        onClick={() => { setHeaterPos('wall'); setSimulating(true); }}
                                        className="absolute left-4 top-1/2 -translate-y-1/2 bg-white hover:bg-red-50 text-red-500 border-2 border-red-200 px-4 py-2 rounded-lg font-bold shadow-sm transition-transform hover:scale-105"
                                    >
                                        Place on Wall
                                    </button>

                                    <button 
                                        onClick={() => { setHeaterPos('floor'); setSimulating(true); }}
                                        className="absolute bottom-4 left-1/2 -translate-x-1/2 bg-white hover:bg-red-50 text-red-500 border-2 border-red-200 px-4 py-2 rounded-lg font-bold shadow-sm transition-transform hover:scale-105"
                                    >
                                        Place on Floor
                                    </button>
                                    </>
                                )}
                            </div>
                            {simulating && <p className="text-center text-slate-500 animate-pulse">Simulating air currents...</p>}
                            </div>
                        ) : (
                            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 animate-fade-in text-center">
                            <div className="mb-6">
                                {score > 80 ? (
                                    <Trophy size={64} className="mx-auto text-yellow-500 mb-2" />
                                ) : (
                                    <Wind size={64} className="mx-auto text-blue-400 mb-2" />
                                )}
                                <h4 className="text-3xl font-bold text-slate-800">Efficiency Score: {score}%</h4>
                            </div>
                            
                            <div className="text-left bg-white p-6 rounded-lg shadow-sm mb-6 max-w-2xl mx-auto">
                                {heaterPos === 'floor' && (
                                    <p className="text-green-700"><strong>Perfect!</strong> Since hot air is less dense, it rises. By placing the heater on the floor, the hot air rises, pushes cold air down to be heated, creating a circulation loop called a <strong>Convection Current</strong>.</p>
                                )}
                                {heaterPos === 'ceiling' && (
                                    <p className="text-red-700"><strong>Inefficient.</strong> Hot air rises. If the heater is on the ceiling, the hot air stays trapped at the top, and the bottom of the room stays cold!</p>
                                )}
                                {heaterPos === 'wall' && (
                                    <p className="text-yellow-700"><strong>Okay, but not best.</strong> Placing it on the wall creates some circulation, but it's not as effective as the floor for full-room heating.</p>
                                )}
                            </div>

                            <div className="flex justify-center gap-4">
                                <button onClick={reset} className="flex items-center gap-2 text-slate-500 hover:text-slate-800 font-semibold px-4 py-2">
                                <RotateCcw size={18} /> Try Another Spot
                                </button>
                                {score > 80 && (
                                    <button onClick={onComplete} className="bg-slate-900 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-800 flex items-center gap-2">
                                    Next Level <ArrowRight size={18} />
                                </button>
                                )}
                            </div>
                            </div>
                        )}
                        </div>
                    </div>
                </div>
            );
        };

        // 4. Radiation Experiment
        const RadiationExp = ({ onComplete }) => {
            const [shirtColor, setShirtColor] = useState('white');
            const [simulating, setSimulating] = useState(false);
            const [temp, setTemp] = useState(25);
            const [time, setTime] = useState(0);

            useEffect(() => {
                let interval;
                if (simulating && time < 100) {
                    interval = setInterval(() => {
                        setTime(t => t + 1);
                        setTemp(currentTemp => {
                            let rate = 0;
                            if (shirtColor === 'black') rate = 0.8;
                            if (shirtColor === 'white') rate = 0.2;
                            if (shirtColor === 'shiny') rate = 0.05;
                            return currentTemp + rate + (Math.random() * 0.1);
                        });
                    }, 50);
                } else if (time >= 100) {
                    setSimulating(false);
                }
                return () => clearInterval(interval);
            }, [simulating, time, shirtColor]);

            const startSim = (color) => {
                setShirtColor(color);
                setTemp(25);
                setTime(0);
                setSimulating(true);
            };

            const getFeedback = () => {
                if (shirtColor === 'black') return { title: 'Maximum Absorption!', text: 'Black surfaces absorb all wavelengths of light, converting light energy into heat energy very efficiently.', color: 'text-red-600' };
                if (shirtColor === 'white') return { title: 'Reflection!', text: 'White surfaces reflect most light wavelengths, keeping the object cooler.', color: 'text-blue-600' };
                if (shirtColor === 'shiny') return { title: 'Mirror Effect!', text: 'Shiny surfaces reflect radiation directly, absorbing almost no heat.', color: 'text-blue-400' };
                return {};
            }

            return (
                <div className="max-w-4xl mx-auto w-full">
                <div className="bg-white rounded-2xl shadow-xl overflow-hidden">
                <div className="bg-yellow-500 p-6 text-white flex justify-between items-center">
                    <div>
                    <h2 className="text-2xl font-bold flex items-center gap-2"><Sun /> Experiment 3: Radiation</h2>
                    <p className="opacity-90">Heat moving as waves (light/infrared) through space.</p>
                    </div>
                    <div className="bg-white/20 px-4 py-2 rounded-lg backdrop-blur-sm">
                    Target: Observe absorption!
                    </div>
                </div>
        
                <div className="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                    {/* Visualizer */}
                    <div className="bg-sky-100 rounded-xl p-8 flex flex-col items-center justify-between relative overflow-hidden h-80 border-2 border-sky-200 shadow-inner">
                        <Sun size={64} className={`text-yellow-500 absolute top-4 right-4 ${simulating ? 'animate-spin-slow' : ''}`} />
                        
                        {/* Sun Rays */}
                        {simulating && (
                            <div className="absolute inset-0 pointer-events-none">
                                {[...Array(5)].map((_, i) => (
                                    <div 
                                        key={i}
                                        className="absolute bg-yellow-400/30 w-1"
                                        style={{
                                            height: '200px',
                                            left: `${30 + i * 10}%`,
                                            top: '40px',
                                            transform: 'rotate(-20deg)',
                                            animation: `pulse 1s infinite ${i * 0.2}s`
                                        }}
                                    />
                                ))}
                            </div>
                        )}

                        {/* The Object */}
                        <div className="mt-auto relative z-10 text-center">
                            <div 
                                className={`w-32 h-32 rounded-2xl shadow-2xl mb-4 transition-colors duration-500 border-4 border-slate-300 flex items-center justify-center
                                ${shirtColor === 'black' ? 'bg-slate-900' : ''}
                                ${shirtColor === 'white' ? 'bg-white' : ''}
                                ${shirtColor === 'shiny' ? 'bg-gradient-to-br from-slate-300 via-white to-slate-300' : ''}
                                `}
                            >
                                <Thermometer size={32} className={`${shirtColor === 'black' ? 'text-white' : 'text-slate-800'}`} />
                            </div>
                            <div className="bg-white/80 backdrop-blur px-4 py-2 rounded-lg font-mono font-bold text-2xl shadow-sm border border-slate-200">
                                {temp.toFixed(1)}°C
                            </div>
                        </div>
                    </div>
        
                    {/* Controls */}
                    <div className="space-y-6 flex flex-col justify-center">
                        {!simulating && time === 0 && (
                            <>
                                <h3 className="text-xl font-bold text-slate-800">Pick a surface type:</h3>
                                <div className="space-y-3">
                                    <button onClick={() => startSim('black')} className="w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-slate-800 hover:bg-slate-50 transition-all flex items-center gap-4 group">
                                        <div className="w-8 h-8 rounded-full bg-slate-900 shadow-sm"></div>
                                        <span className="font-semibold text-slate-700 group-hover:text-slate-900">Matte Black</span>
                                    </button>
                                    <button onClick={() => startSim('white')} className="w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-slate-400 hover:bg-slate-50 transition-all flex items-center gap-4 group">
                                        <div className="w-8 h-8 rounded-full bg-white border border-slate-300 shadow-sm"></div>
                                        <span className="font-semibold text-slate-700 group-hover:text-slate-900">Pure White</span>
                                    </button>
                                    <button onClick={() => startSim('shiny')} className="w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-blue-300 hover:bg-blue-50 transition-all flex items-center gap-4 group">
                                        <div className="w-8 h-8 rounded-full bg-gradient-to-br from-gray-200 to-white border border-slate-300 shadow-sm"></div>
                                        <span className="font-semibold text-slate-700 group-hover:text-slate-900">Shiny Foil</span>
                                    </button>
                                </div>
                            </>
                        )}

                        {simulating && (
                            <div className="text-center py-12">
                                <div className="text-4xl font-bold text-slate-300 mb-2">Measuring...</div>
                                <div className="w-full bg-gray-200 rounded-full h-2.5">
                                    <div className="bg-yellow-500 h-2.5 rounded-full transition-all duration-75" style={{ width: `${time}%` }}></div>
                                </div>
                            </div>
                        )}

                        {!simulating && time >= 100 && (
                            <div className="animate-fade-in bg-slate-50 p-6 rounded-xl border border-slate-200">
                                <h4 className={`text-xl font-bold mb-2 ${getFeedback().color}`}>{getFeedback().title}</h4>
                                <p className="text-slate-600 text-sm mb-6">{getFeedback().text}</p>
                                
                                <div className="flex gap-3">
                                    <button onClick={() => { setTime(0); setTemp(25); }} className="flex-1 py-2 rounded-lg border border-slate-300 text-slate-600 font-bold hover:bg-white transition-colors">Test Another</button>
                                    <button onClick={onComplete} className="flex-1 py-2 rounded-lg bg-yellow-500 text-white font-bold hover:bg-yellow-600 transition-colors shadow-lg shadow-yellow-200">Finish Lab</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
                </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [phase, setPhase] = useState('intro'); // intro, conduction, convection, radiation, complete

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans p-4 md:p-8">
                {/* Header */}
                <header className="max-w-4xl mx-auto mb-8 flex items-center justify-between">
                    <div className="flex items-center gap-2 font-bold text-xl text-slate-700">
                        <div className="bg-slate-800 text-white p-2 rounded-lg"><Flame size={20} /></div>
                        <span>Valtorta College <span className="text-red-500">Thermal Lab</span></span>
                    </div>
                    <div className="flex gap-2 text-sm font-medium text-slate-400">
                        <span className={phase === 'conduction' ? 'text-red-500' : ''}>1. Solid</span> • 
                        <span className={phase === 'convection' ? 'text-blue-500' : ''}> 2. Fluid</span> • 
                        <span className={phase === 'radiation' ? 'text-yellow-500' : ''}> 3. Space</span>
                    </div>
                </header>

                {/* Main Content Area */}
                <main className="transition-all duration-500 ease-in-out">
                    {phase === 'intro' && <IntroScreen onStart={() => setPhase('conduction')} />}
                    {phase === 'conduction' && <ConductionExp onComplete={() => setPhase('convection')} />}
                    {phase === 'convection' && <ConvectionExp onComplete={() => setPhase('radiation')} />}
                    {phase === 'radiation' && <RadiationExp onComplete={() => setPhase('complete')} />}
                    
                    {phase === 'complete' && (
                    <div className="text-center max-w-2xl mx-auto py-12 animate-bounce-in">
                        <div className="inline-block p-8 rounded-full bg-green-100 mb-6 shadow-xl">
                            <Trophy size={80} className="text-green-600" />
                        </div>
                        <h1 className="text-4xl font-bold text-slate-800 mb-4">Training Complete!</h1>
                        <p className="text-xl text-slate-600 mb-8">
                            You have mastered the three forms of heat transfer. You are now ready to tackle real-world engineering challenges!
                        </p>
                        <button 
                            onClick={() => setPhase('intro')}
                            className="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-800 shadow-lg hover:shadow-xl transition-all"
                            >
                            Return to Main Menu
                        </button>
                    </div>
                    )}
                </main>

                {/* Footer */}
                <footer className="text-center text-slate-400 mt-12 text-sm">
                    Valtorta College Heat Transfer Interactive Demo
                </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
