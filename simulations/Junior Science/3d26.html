<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valtorta College Photosynthesis Dash</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 80%, #8B4513 80%, #5D2906 100%);
            touch-action: none; /* Prevent browser scrolling on swipe */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #score-board {
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            background: rgba(255, 255, 255, 0.8);
            border-bottom-right-radius: 15px;
            display: inline-block;
            align-self: flex-start;
            pointer-events: auto;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        #level-indicator {
            display: block;
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
        }

        #timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 15px;
            pointer-events: auto;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        #progress-bar-container {
            width: 300px;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            margin-top: 5px;
            overflow: hidden;
            border: 2px solid #fff;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #4CAF50;
            transition: width 0.3s ease;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            pointer-events: auto;
            max-width: 90%;
        }

        h1 { color: #2E8B57; margin-top: 0; }
        p { color: #555; line-height: 1.5; }

        button {
            background-color: #2E8B57;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.1s, background-color 0.2s;
            font-weight: bold;
        }

        button:hover {
            background-color: #277549;
            transform: scale(1.05);
        }
        
        button:active {
            transform: scale(0.95);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 16px;
        }
        .legend-icon { font-size: 24px; margin-right: 10px; width: 30px; text-align: center;}

        /* Floating text animation */
        .float-text {
            position: absolute;
            font-weight: bold;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            text-shadow: 1px 1px 2px white;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="score-board">
            <span id="level-indicator">Level 1</span>
            <div>Growth: <span id="score-val">0</span> / 100</div>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
        </div>
        <div id="timer">Time: 60s</div>
    </div>

    <div id="start-screen">
        <h1 id="start-title">Valtorta College Photosynthesis Dash</h1>
        <p id="start-desc">Help the plant grow by collecting ingredients for photosynthesis!</p>
        <div style="text-align: left; display: inline-block; margin: 15px 0;">
            <div class="legend-item"><span class="legend-icon">☀️</span> Catch Sun (+10)</div>
            <div class="legend-item"><span class="legend-icon">🏜️</span> Catch Sand/Soil (+10)</div>
            <div class="legend-item"><span class="legend-icon">🗑️</span> Avoid Rubbish (-5)</div>
        </div>
        <br>
        <p><small>Use <b>Arrow Keys</b> or <b>Touch/Drag</b> to move.</small></p>
        <button id="start-btn" onclick="startGame(1)">Start Level 1</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1 id="end-title">Game Over</h1>
        <p id="end-message"></p>
        <button id="restart-btn" onclick="startGame(1)">Play Again</button>
    </div>
</div>

<script>
    // --- Configuration ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiLayer = document.getElementById('ui-layer');
    const scoreVal = document.getElementById('score-val');
    const progressBar = document.getElementById('progress-bar');
    const levelIndicator = document.getElementById('level-indicator');
    const startScreen = document.getElementById('start-screen');
    const startTitle = document.getElementById('start-title');
    const startDesc = document.getElementById('start-desc');
    const startBtn = document.getElementById('start-btn');
    
    const gameOverScreen = document.getElementById('game-over-screen');
    const endTitle = document.getElementById('end-title');
    const endMessage = document.getElementById('end-message');
    const restartBtn = document.getElementById('restart-btn');
    const timerDisplay = document.getElementById('timer');

    // Game State
    let gameRunning = false;
    let score = 0;
    let level = 1;
    const winningScore = 100;
    let timeLeft = 60;
    let width, height;
    let items = [];
    let lastTime = 0;
    let spawnTimer = 0;
    let particles = [];

    // Player State
    const player = {
        x: 0,
        y: 0,
        width: 80,
        height: 100,
        speed: 0, // Current movement speed
        maxSpeed: 10,
        targetX: null // For touch/mouse control
    };

    // Images/Assets (Drawing them procedurally to keep it single-file)
    const TYPE_SUN = 'sun';
    const TYPE_SAND = 'sand';
    const TYPE_RUBBISH = 'rubbish';

    // Input Handling
    const keys = { ArrowLeft: false, ArrowRight: false };

    // --- Initialization ---
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        
        // Ground level logic
        player.y = height - 130; 
        if (!gameRunning) {
             player.x = width / 2 - player.width / 2;
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // Controls
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
        if (e.key === 'ArrowRight') keys.ArrowRight = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
        if (e.key === 'ArrowRight') keys.ArrowRight = false;
    });

    // Touch/Mouse Controls
    function handleInput(x) {
        if (!gameRunning) return;
        player.targetX = x - player.width / 2;
    }

    canvas.addEventListener('mousemove', (e) => handleInput(e.clientX));
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        handleInput(e.touches[0].clientX);
    }, { passive: false });
    
    canvas.addEventListener('touchstart', (e) => {
        if(!gameRunning) return;
        handleInput(e.touches[0].clientX);
    }, {passive: false});


    // --- Game Logic ---

    function startGame(lvl) {
        level = lvl;
        score = 0;
        items = [];
        particles = [];
        
        // Level Configuration
        if (level === 1) {
            timeLeft = 60;
            levelIndicator.innerText = "Level 1";
        } else {
            timeLeft = 45; // Faster time for level 2
            levelIndicator.innerText = "Level 2 (Hard)";
        }

        gameRunning = true;
        updateScoreUI();
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        player.x = width / 2 - player.width / 2;
        player.targetX = null;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function spawnItem() {
        const speedMultiplier = level === 1 ? 1 : 1.5; // 50% faster items in level 2
        
        let itemsToSpawn = [];

        if (level === 1) {
            // Level 1: Guaranteed Sun, Sand, Rubbish (Equal split/All at once)
            itemsToSpawn = [TYPE_SUN, TYPE_SAND, TYPE_RUBBISH];
        } else {
            // Level 2: 70% Rubbish, High difficulty
            // We spawn 3 items to keep density, but randomly weighted
            for(let i=0; i<3; i++) {
                const rand = Math.random();
                if (rand < 0.70) {
                    itemsToSpawn.push(TYPE_RUBBISH);
                } else if (rand < 0.85) {
                    itemsToSpawn.push(TYPE_SUN);
                } else {
                    itemsToSpawn.push(TYPE_SAND);
                }
            }
        }
        
        // Create the items
        itemsToSpawn.forEach(type => {
            const size = 50;
            const x = Math.random() * (width - size);
            
            items.push({
                x: x,
                y: -60 - (Math.random() * 100), // Staggered start
                size: size,
                type: type,
                speed: (3 + Math.random() * 3 + (score * 0.02)) * speedMultiplier
            });
        });
    }

    function update(dt) {
        // Update Timer
        timeLeft -= dt / 1000;
        if (timeLeft <= 0) {
            timeLeft = 0;
            timerDisplay.innerText = "Time: 0s";
            endGame(false);
            return;
        }
        timerDisplay.innerText = "Time: " + Math.ceil(timeLeft) + "s";

        // Player Movement
        if (player.targetX !== null) {
            // Mouse/Touch follows
            const dx = player.targetX - player.x;
            player.x += dx * 0.2; // Smooth lerp
            if (Math.abs(dx) < 1) player.targetX = null;
        } else {
            // Keyboard
            if (keys.ArrowLeft) player.x -= player.maxSpeed;
            if (keys.ArrowRight) player.x += player.maxSpeed;
        }

        // Boundaries
        if (player.x < 0) player.x = 0;
        if (player.x > width - player.width) player.x = width - player.width;

        // Spawner
        spawnTimer += dt;
        if (spawnTimer > 1000) { // Spawn every second (approx)
            spawnItem();
            spawnTimer = 0;
        }

        // Items Logic
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.y += item.speed;

            // Collision Detection
            if (
                item.x < player.x + player.width - 10 &&
                item.x + item.size > player.x + 10 &&
                item.y < player.y + player.height - 20 &&
                item.y + item.size > player.y + 20
            ) {
                // Hit!
                handleCollision(item);
                items.splice(i, 1);
                continue;
            }

            // Remove if off screen
            if (item.y > height) {
                items.splice(i, 1);
            }
        }
        
        // Check Win
        if (score >= winningScore) {
            endGame(true);
        }
    }

    function handleCollision(item) {
        let change = 0;
        let text = "";
        let color = "";

        if (item.type === TYPE_SUN) {
            change = 10;
            text = "+10 Energy!";
            color = "#FFA500";
            createParticles(item.x, item.y, '#FFD700');
        } else if (item.type === TYPE_SAND) {
            change = 10;
            text = "+10 Minerals!";
            color = "#8B4513";
            createParticles(item.x, item.y, '#C2B280');
        } else if (item.type === TYPE_RUBBISH) {
            change = -5;
            text = "-5 Pollution!";
            color = "#555";
            createParticles(item.x, item.y, '#555555');
        }

        score += change;
        if (score < 0) score = 0;
        updateScoreUI();
        showFloatingText(text, player.x, player.y, color);
    }

    function updateScoreUI() {
        scoreVal.innerText = Math.floor(score);
        const percent = Math.min(100, Math.max(0, (score / winningScore) * 100));
        progressBar.style.width = percent + "%";
        
        // Change color based on health/growth
        if (score > 80) player.color = "#2ecc71"; // Healthy Green
        else if (score > 40) player.color = "#f1c40f"; // Yellowing
        else player.color = "#e67e22"; // Wilting
    }

    function showFloatingText(text, x, y, color) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.style.left = (x + 20) + 'px';
        el.style.top = y + 'px';
        el.style.color = color;
        el.innerText = text;
        uiLayer.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }
    
    function createParticles(x, y, color) {
        for(let i=0; i<8; i++) {
            particles.push({
                x: x + 25,
                y: y + 25,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    }

    function endGame(win) {
        gameRunning = false;
        gameOverScreen.classList.remove('hidden');
        
        if (win) {
            if (level === 1) {
                endTitle.innerText = "Level 1 Complete!";
                endTitle.style.color = "#27ae60";
                endMessage.innerText = "Great job! Get ready for a challenge.";
                
                restartBtn.innerText = "Start Level 2";
                restartBtn.onclick = () => startGame(2);
            } else {
                endTitle.innerText = "You Win!";
                endTitle.style.color = "#27ae60";
                endMessage.innerText = "You are a Master Photosynthesis Expert!";
                
                restartBtn.innerText = "Play Again";
                restartBtn.onclick = () => startGame(1);
            }
        } else {
            endTitle.innerText = "Time's Up!";
            endTitle.style.color = "#e74c3c";
            endMessage.innerText = "Don't give up, try again!";
            
            restartBtn.innerText = "Retry Level " + level;
            restartBtn.onclick = () => startGame(level);
        }
    }

    // --- Rendering ---

    function draw() {
        // Clear background
        ctx.clearRect(0, 0, width, height);

        // Draw Ground (Already in CSS, but let's add detail)
        ctx.fillStyle = "#5D2906"; // Dark brown
        ctx.fillRect(0, height - 80, width, 80);
        ctx.fillStyle = "#8B4513"; // Lighter brown topsoil
        ctx.fillRect(0, height - 90, width, 20);

        // Draw Player (Plant)
        drawPlant(player.x, player.y, player.width, player.height);

        // Draw Items
        items.forEach(item => {
            drawItem(item);
        });
        
        // Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
            
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    function drawPlant(x, y, w, h) {
        ctx.save();
        ctx.translate(x + w/2, y + h); // Pivot at bottom center
        
        // Wobble effect based on movement
        const wobble = Math.sin(Date.now() / 200) * 0.05;
        ctx.rotate(wobble);

        // Pot
        ctx.fillStyle = "#CD853F";
        ctx.beginPath();
        ctx.moveTo(-20, 0);
        ctx.lineTo(20, 0);
        ctx.lineTo(15, -30);
        ctx.lineTo(-15, -30);
        ctx.fill();

        // Stem
        ctx.strokeStyle = "#228B22";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.quadraticCurveTo(5, -60, 0, -90);
        ctx.stroke();

        // Leaves (Grow with score!)
        const growthFactor = 0.5 + (score / 200); // 0.5 to 1.0
        
        ctx.fillStyle = "#32CD32";
        
        // Left Leaf
        ctx.beginPath();
        ctx.ellipse(-15, -60, 20 * growthFactor, 10, -0.5, 0, Math.PI * 2);
        ctx.fill();

        // Right Leaf
        ctx.beginPath();
        ctx.ellipse(15, -50, 20 * growthFactor, 10, 0.5, 0, Math.PI * 2);
        ctx.fill();

        // Top Leaf / Flower bud
        if (score >= 90) {
            ctx.fillStyle = "#FF69B4"; // Flower!
            ctx.beginPath();
            ctx.arc(0, -95, 10, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.fillStyle = "#32CD32";
            ctx.beginPath();
            ctx.ellipse(0, -90, 10, 20 * growthFactor, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    function drawItem(item) {
        const cx = item.x + item.size / 2;
        const cy = item.y + item.size / 2;
        const r = item.size / 2;

        ctx.save();
        ctx.translate(cx, cy);

        if (item.type === TYPE_SUN) {
            // Glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = "yellow";
            // Core
            ctx.fillStyle = "#FFD700";
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.8, 0, Math.PI * 2);
            ctx.fill();
            // Rays
            ctx.strokeStyle = "orange";
            ctx.lineWidth = 3;
            ctx.shadowBlur = 0;
            for(let i=0; i<8; i++) {
                ctx.rotate(Math.PI / 4);
                ctx.beginPath();
                ctx.moveTo(r * 0.9, 0);
                ctx.lineTo(r * 1.3, 0);
                ctx.stroke();
            }
        } else if (item.type === TYPE_SAND) {
            // Sand Pile / Soil Bag
            ctx.fillStyle = "#C2B280";
            ctx.beginPath();
            ctx.moveTo(-r, r);
            ctx.lineTo(r, r);
            ctx.lineTo(0, -r/2);
            ctx.fill();
            // Dots
            ctx.fillStyle = "#5D4037";
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.arc((Math.random()-0.5)*r, (Math.random()*r) - r/4, 2, 0, Math.PI*2);
                ctx.fill();
            }
        } else if (item.type === TYPE_RUBBISH) {
            // Trash Bag
            ctx.fillStyle = "#555";
            ctx.beginPath();
            ctx.moveTo(-r*0.6, r*0.8);
            ctx.lineTo(r*0.6, r*0.8);
            ctx.lineTo(r*0.5, -r*0.5);
            ctx.lineTo(-r*0.5, -r*0.5);
            ctx.fill();
            // Tie
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -r*0.5);
            ctx.lineTo(0, -r*0.8);
            ctx.stroke();
            
            // Stink lines
            ctx.strokeStyle = "#88AA00";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(r*0.6, 0);
            ctx.quadraticCurveTo(r, -r/2, r*0.8, -r);
            ctx.stroke();
        }

        ctx.restore();
    }

    // --- Main Loop ---
    function gameLoop(timestamp) {
        if (!gameRunning) return;

        const dt = timestamp - lastTime;
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }

</script>
</body>
</html>
